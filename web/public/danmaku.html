<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>萤火弹幕 · 东方南堂界遇 V</title>
  <link rel="stylesheet" href="/styles.css?v=11" />
  <link rel="stylesheet" href="/danmaku.css?v=5" />
</head>
<body class="firefly-page">
  <main class="firefly-shell">
    <nav class="firefly-nav" aria-label="游园会"><a href="/arcade.html">← 回游园会</a><a href="/art-credits.html">美术来源</a></nav>
    <header class="firefly-cover">
      <img src="/assets/taisei/wriggle-portrait.svg" alt="" />
      <div><span>四季游园会 · 符卡挑战</span><h1>萤火弹幕</h1><p>灯火散在弹幕里。趁下一波到来前，把它们拾回来。</p></div>
    </header>
    <label class="firefly-mode">难度 <select id="firefly-mode"><option value="normal">巡夜</option><option value="expert">符卡试炼</option></select></label>
    <div class="firefly-ledger"><span>得分 <strong id="firefly-score">0</strong></span><span>下盏倍率 <strong id="firefly-chain">×1</strong></span><span>余时 <strong id="firefly-time">36</strong></span><span>本机最佳 <strong id="firefly-best">0</strong></span></div>
    <div class="firefly-strip"><span id="firefly-pattern" role="status">一符 · 花雨</span><span id="firefly-guard">护身符 0/8</span></div>
    <div class="firefly-stage">
      <canvas id="firefly-field" width="360" height="400" tabindex="0" aria-label="弹幕场地。用方向键或拖动移动。"></canvas>
      <div class="firefly-curtain" id="firefly-curtain">
        <p id="firefly-result" role="status">月下拾灯</p>
        <small id="firefly-detail">穿过三道符卡，撑过 36 秒。</small>
        <dl id="firefly-breakdown" class="firefly-breakdown hidden">
          <div><dt>拾灯</dt><dd id="firefly-lamp-points">0</dd></div>
          <div><dt>擦弹</dt><dd id="firefly-graze-points">0</dd></div>
          <div><dt>破符</dt><dd id="firefly-clear-points">0</dd></div>
        </dl>
        <button type="button" id="firefly-start">开始</button>
      </div>
    </div>
    <p class="firefly-help">拖动或用方向键移动。每盏灯 10 分，4 秒内接着拾灯，倍率最高 ×4。擦弹加 2 分，累计八次可挡下一次碰撞。虚线出现时，提前让开弹道。</p>
    <button type="button" id="firefly-pause" disabled>暂停</button>
    <p id="firefly-ranking-status" class="firefly-help" role="status"></p>
    <section id="firefly-ranking" aria-label="弹幕排行榜"></section>
  </main>
  <script src="/arcade-scores.js"></script>
  <script src="/danmaku.js?v=5"></script>
</body>
</html>
