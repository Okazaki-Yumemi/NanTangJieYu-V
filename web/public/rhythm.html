<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>后户鼓乐 · 四季游园会</title>
  <link rel="stylesheet" href="/rhythm.css?v=4" />
</head>
<body>
  <main class="drum-book">
    <a class="back" href="/arcade.html">← 四季游园会</a>
    <header class="drum-cover"><div><p>后户之门　｜　祭乐</p><h1>后户鼓乐</h1><p>门后鼓声一起，四季便轮番登场。</p></div></header>
    <section class="drum-console" aria-label="鼓乐场地">
      <div class="drum-choices">
        <label for="drum-chart">曲目</label>
        <select id="drum-chart"><option value="0">秘匿されたフォーシーズンズ</option><option value="1">秘神マターラ</option></select>
        <button id="drum-mute" type="button" aria-pressed="false">静音</button>
      </div>
      <div class="drum-choices drum-difficulty">
        <label for="drum-level">难度</label>
        <select id="drum-level">
          <option value="normal">常乐</option>
          <option value="hard" selected>急奏</option>
          <option value="expert">秘演</option>
          <option value="master">神乐</option>
          <option value="lunatic">秘神</option>
        </select>
        <span id="drum-chart-info"></span>
      </div>
      <div class="drum-choices drum-audio">
        <label for="drum-source">音轨</label>
        <select id="drum-source"><option value="original">原曲全谱</option><option value="practice">短谱练习</option></select>
        <label for="drum-volume">音量</label>
        <input id="drum-volume" type="range" min="0" max="100" value="35" />
        <output id="drum-volume-value" for="drum-volume">35%</output>
      </div>
      <dl class="drum-stats"><div><dt>得分 / 10000</dt><dd id="drum-score">0</dd></div><div><dt>连击</dt><dd id="drum-combo">0</dd></div><div><dt>本谱最高</dt><dd id="drum-best">0</dd></div></dl>
      <div class="drum-track" id="drum-track" aria-hidden="true"><i class="drum-line"></i><div id="drum-notes"></div><span id="drum-call">起鼓</span></div>
      <progress id="drum-progress" value="0" max="1" aria-label="演奏进度"></progress>
      <div class="drum-pads">
        <button id="drum-center" type="button" class="drum-pad center" aria-keyshortcuts="D F"><i aria-hidden="true">●</i><strong>鼓心</strong><kbd>D / F</kbd></button>
        <button id="drum-rim" type="button" class="drum-pad rim" aria-keyshortcuts="J K"><i aria-hidden="true">◆</i><strong>鼓沿</strong><kbd>J / K</kbd></button>
      </div>
      <p class="drum-rule">红点敲鼓心，青点敲鼓沿。同一列两颗就一起敲。分数由击中精度（90%）和最长连击（10%）组成。</p>
      <div class="drum-actions"><button id="drum-start" type="button">开演</button><button id="drum-pause" type="button" disabled>暂停</button></div>
      <p id="drum-result" role="status">先选一首，再起鼓。</p>
    </section>
    <section id="drum-leaderboard" class="drum-console drum-ranking" aria-label="鼓乐排行榜"></section>
  </main>
  <script src="/rhythm-tracks.js?v=1"></script>
  <script src="/arcade-scores.js"></script>
  <script src="/rhythm.js?v=4"></script>
</body>
</html>
