<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理后台 · 东方南堂界遇 V</title>
    <link rel="stylesheet" href="/styles.css?v=11" />
    <link rel="stylesheet" href="/admin.css?v=15" />
    <link rel="stylesheet" href="/lottery-stage.css?v=2" />
  </head>
  <body class="admin-body">
    <!-- 登录门 -->
    <main id="admin-login" class="admin-login">
      <div class="login-card">
        <p class="brand-eyebrow">东方南堂界遇 V</p>
        <h1>管理后台</h1>
        <input id="admin-password" type="password" placeholder="管理员口令" />
        <p id="login-error" class="error-text hidden"></p>
        <button id="login-btn" class="primary-btn" type="button">登录</button>
      </div>
    </main>

    <!-- 控制台 -->
    <main id="admin-shell" class="admin-shell hidden">
      <header class="admin-header">
        <div>
          <strong>东方南堂界遇 V · 管理后台</strong>
          <span id="admin-activity-chip" class="status-chip"></span>
        </div>
        <div class="admin-header-actions">
          <a href="/" target="_blank" rel="noopener">玩家端</a>
          <a href="/display.html" target="_blank" rel="noopener">大屏</a>
          <button id="refresh-btn" class="mini-btn" type="button">刷新</button>
          <button id="logout-btn" class="mini-btn" type="button">退出</button>
        </div>
      </header>

      <nav class="admin-tabs" id="admin-tabs">
        <button class="tab-btn active" data-tab="overview" type="button">活动状态</button>
        <button class="tab-btn" data-tab="regions" type="button">地图区域</button>
        <button class="tab-btn" data-tab="players" type="button">玩家管理</button>
        <button class="tab-btn" data-tab="codes" type="button">注册码</button>
        <button class="tab-btn" data-tab="lottery" type="button">抽奖</button>
        <button class="tab-btn" data-tab="logs" type="button">操作日志</button>
      </nav>

      <section id="tab-overview" class="tab-panel"></section>
      <section id="tab-regions" class="tab-panel hidden"></section>
      <section id="tab-players" class="tab-panel hidden"></section>
      <section id="tab-codes" class="tab-panel hidden"></section>
      <section id="tab-lottery" class="tab-panel hidden"></section>
      <section id="tab-logs" class="tab-panel hidden"></section>
    </main>

    <dialog class="draw-show" id="draw-show" aria-labelledby="draw-show-title">
      <div class="draw-show-frame">
        <div class="draw-show-flare" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
        <div class="draw-show-sparks" aria-hidden="true"></div>
        <header class="draw-show-header">
          <div class="draw-show-brand"><b>东方南堂界遇 V</b><span>终盘抽奖</span></div>
          <button class="draw-show-close" type="button" autofocus>返回抽奖台</button>
        </header>
        <div class="draw-show-content">
          <div class="draw-show-prize">
            <span class="draw-show-prize-art" aria-hidden="true"><img alt="" hidden /><i>✦</i></span>
            <div><p>本轮奖品</p><h2 class="draw-show-prize-name" id="draw-show-title"></h2></div>
          </div>
          <div class="draw-show-chamber">
            <div class="draw-show-halo" aria-hidden="true">
              <svg viewBox="0 0 520 520" fill="none" stroke="currentColor">
                <circle cx="260" cy="260" r="247" stroke-width="2" stroke-dasharray="2 10" />
                <circle cx="260" cy="260" r="230" />
                <circle cx="260" cy="260" r="218" stroke-width="3" stroke-dasharray="36 10 4 10" />
                <circle cx="260" cy="260" r="180" />
                <path d="M260 24L496 260 260 496 24 260Z M260 50L470 260 260 470 50 260Z" />
                <path d="M260 26V104M260 416v78M26 260h78m312 0h78" stroke-width="2" />
              </svg>
            </div>
            <div class="draw-show-window" aria-hidden="true"><div class="draw-show-reel"></div></div>
            <div class="draw-show-marker" aria-hidden="true"></div>
            <section class="draw-show-winner" aria-hidden="true" hidden>
              <span class="draw-show-ticket-foil" aria-hidden="true"></span>
              <p>恭喜中奖</p>
              <strong class="draw-show-winner-name"></strong>
              <span class="draw-show-winner-team"></span>
            </section>
            <div class="draw-show-doors" aria-hidden="true">
              <div class="draw-show-door is-left"></div>
              <div class="draw-show-door is-right"></div>
              <div class="draw-show-seal">
                <svg viewBox="0 0 104 104" fill="none" stroke="currentColor" stroke-width="1.4">
                  <circle cx="52" cy="52" r="47" />
                  <circle cx="52" cy="52" r="40" stroke-dasharray="1 4" />
                  <path d="M52 12L92 52 52 92 12 52Z M52 23L81 52 52 81 23 52Z" />
                  <path d="M52 52Q31 43 52 29Q73 43 52 52Q61 31 75 52Q61 73 52 52Q73 61 52 75Q31 61 52 52Q43 73 29 52Q43 31 52 52Z" fill="currentColor" fill-opacity=".22" />
                  <circle cx="52" cy="52" r="4" fill="currentColor" />
                </svg>
              </div>
            </div>
          </div>
          <div class="draw-show-phase" role="status">
            <span class="draw-show-phase-text"></span>
            <span class="draw-show-announcement"></span>
          </div>
        </div>
        <footer class="draw-show-footer"><button class="draw-show-skip" type="button" hidden>直接揭晓</button></footer>
      </div>
    </dialog>
    <div id="toast-container"></div>

    <script src="/common.js?v=11"></script>
    <script src="/lottery-stage.js?v=2"></script>
    <script src="/admin.js?v=16"></script>
  </body>
</html>
