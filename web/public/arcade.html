<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>四季游园会 · 东方南堂界遇 V</title>
  <link rel="stylesheet" href="/styles.css?v=11" />
  <link rel="stylesheet" href="/atmosphere.css?v=5" />
  <link rel="stylesheet" href="/arcade.css?v=1" />
</head>
<body>
  <main class="arcade-shell">
    <a class="arcade-return" href="/">← 回校园</a>
    <header class="arcade-cover">
      <img src="/assets/event-poster.jpg" alt="" width="1600" height="3200" />
      <div>
        <p>东方南堂界遇 V</p>
        <h1>四季游园会</h1>
        <p>从后门进，挑一摊玩。</p>
      </div>
    </header>
    <ul class="arcade-tickets" aria-label="游园摊位">
      <li class="arcade-ticket ticket-drum"><a href="/rhythm.html">
        <span class="ticket-number">壹</span><span class="ticket-type">节奏</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><ellipse cx="32" cy="30" rx="22" ry="13"/><path d="M10 30v12c0 17 44 17 44 0V30M17 37l7 14m23-14-7 14M24 24 42 6m-4 20L53 9"/></svg>
        <strong>后户鼓乐</strong><small>看准落点，敲鼓心或鼓沿。</small><span class="ticket-record" id="arcade-rhythm" hidden></span>
      </a></li>
      <li class="arcade-ticket ticket-puzzle"><a href="/puzzle.html">
        <span class="ticket-number">贰</span><span class="ticket-type">解谜</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 29 30 17l21 12v23L30 63 9 52zm0 0 21 12 21-12M30 41v22m-11-39 21 12v10M49 8h9v9m-9-1 9-8"/></svg>
        <strong>四季推箱</strong><small>推对每只箱子，给自己留条退路。</small><span class="ticket-record" id="arcade-puzzle" hidden></span>
      </a></li>
      <li class="arcade-ticket ticket-bullet"><a href="/danmaku.html">
        <span class="ticket-number">叁</span><span class="ticket-type">动作</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="m33 17 5 12 12 5-12 5-5 12-5-12-12-5 12-5zM8 52l7-7m35-29 6-6M12 12l8 8m25 26 9 9"/></svg>
        <strong>萤火弹幕</strong><small>从弹幕间穿过去，把灯火带回来。</small><span class="ticket-record" id="arcade-danmaku" hidden></span>
      </a></li>
      <li class="arcade-ticket ticket-lake"><a href="/fishing.html">
        <span class="ticket-number">肆</span><span class="ticket-type">钓鱼</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 52Q22 6 47 10v23m-5 0h10v10H42zM5 58h16m13-7h24"/></svg>
        <strong>湖边钓鱼</strong><small>免费试钓，或把正式鱼获带上大鱼榜。</small>
      </a></li>
      <li class="arcade-ticket ticket-workshop"><a href="/practice.html">
        <span class="ticket-number">伍</span><span class="ticket-type">调查</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="12" width="48" height="40" rx="3"/><path d="M14 35h9l6-13 8 18 5-8h8M16 45h8m20 0h4"/></svg>
        <strong>调查练习室</strong><small>擦窗、接线、熄地灯，十个任务随便试。</small>
      </a></li>
      <li class="arcade-ticket ticket-dye"><a href="/dye.html">
        <span class="ticket-number">陆</span><span class="ticket-type">染布</span>
        <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M11 13h42v38H11zM25 13v38m14-38v38M11 26h42M11 39h42M7 9v46m50-46v46"/></svg>
        <strong>染布摊</strong><small>用有限的染料，把拼布染成一色。</small>
      </a></li>
    </ul>
  </main>
  <script src="/common.js?v=11"></script>
  <script src="/arcade.js?v=1"></script>
</body>
</html>
