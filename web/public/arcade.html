<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>四季游园会 · 东方南堂界遇 V</title>
  <link rel="stylesheet" href="/styles.css?v=11" />
  <link rel="stylesheet" href="/atmosphere.css?v=5" />
  <link rel="stylesheet" href="/arcade.css?v=2" />
</head>
<body>
  <main class="arcade-shell">
    <a class="arcade-return" href="/">← 回校园</a>
    <header class="arcade-cover">
      <img src="/assets/event-poster.jpg" alt="" width="1600" height="3200" />
      <div>
        <p>东方南堂界遇 V</p>
        <h1>四季游园会</h1>
        <p>从后门进，挑一摊玩。</p>
      </div>
    </header>
    <ul class="arcade-tickets" aria-label="游园摊位">
      <li class="arcade-ticket ticket-drum"><a href="/rhythm.html">
        <span class="ticket-number">壹</span><span class="ticket-type">节奏</span>
        <strong>后户鼓乐</strong><small>看准落点，敲鼓心或鼓沿。</small><span class="ticket-record" id="arcade-rhythm" hidden></span>
      </a></li>
      <li class="arcade-ticket ticket-puzzle"><a href="/puzzle.html">
        <span class="ticket-number">贰</span><span class="ticket-type">解谜</span>
        <strong>四季推箱</strong><small>八关推箱，进阶关要把箱子送到对应印记。</small><span class="ticket-record" id="arcade-puzzle" hidden></span>
      </a></li>
      <li class="arcade-ticket ticket-bullet"><a href="/danmaku.html">
        <span class="ticket-number">叁</span><span class="ticket-type">动作</span>
        <strong>萤火弹幕</strong><small>符卡试炼限时拾灯，留意瞄准弹的预警。</small><span class="ticket-record" id="arcade-danmaku" hidden></span>
      </a></li>
      <li class="arcade-ticket ticket-lake"><a href="/fishing.html">
        <span class="ticket-number">肆</span><span class="ticket-type">钓鱼</span>
        <strong>湖边钓鱼</strong><small>免费试钓，或把正式鱼获带上大鱼榜。</small>
      </a></li>
      <li class="arcade-ticket ticket-dye"><a href="/dye.html">
        <span class="ticket-number">伍</span><span class="ticket-type">染布</span>
        <strong>染布摊</strong><small>每日换题，盘算每一缸染料怎么用。</small>
      </a></li>
    </ul>
    <footer class="arcade-credit"><a href="/art-credits.html">立绘与素材署名</a></footer>
  </main>
  <script src="/common.js?v=11"></script>
  <script src="/arcade.js?v=2"></script>
</body>
</html>
